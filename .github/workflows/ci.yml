name: CI

# On a push and on a pull request: the changelog, the source lint, a fresh build against the committed dist/
# and the Swift package, with the commands of @chassis-ui/tokens. Written by
# `chassis-tokens init`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tokens:
    name: Tokens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails when the version of package.json has no entry in CHANGELOG.md
      - name: Check the changelog
        run: pnpm release-notes

      - name: Lint source
        run: pnpm lint

      # Fails when the committed dist/ differs from a fresh build of source/
      - name: Verify dist/
        run: pnpm verify

      - name: Check Package.swift
        run: pnpm swift-package:check
