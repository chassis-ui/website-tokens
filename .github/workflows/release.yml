name: Release

# On a push, releases the version in package.json when it has no tag v<version> yet:
# checks the committed dist/ against a fresh build, publishes the package to npm and creates the
# tag and its GitHub release, whose body is the entry of the version in CHANGELOG.md, with the
# Android library of every app and brand attached: <name>-android-<app>-<brand>-<version>.aar, and
# one zip per platform, app and brand: <name>-<platform>-<app>-<brand>-<version>.zip. A push that
# does not change the version releases nothing. Swift Package Manager resolves the tag as the
# version of the Swift package.
# Written by `chassis-tokens init`.
#
# npm trusted publishing: the package trusts this workflow file of this repository, so no npm
# token is needed, and every version has provenance. Renaming this file breaks publishing until
# the trusted publisher on npmjs.com is updated to match.
#
# next is the prerelease channel: a push to next releases only a version with a prerelease part,
# such as 0.4.0-next.0, and a version without one waits for main.
on:
  push:
    branches: [main, next]

permissions:
  contents: read

# Never cancel a run that may be releasing. One group per branch: GitHub keeps one waiting run
# per group and cancels it for a newer one, so a push to next must not wait in the group of main
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A release that failed makes no tag, so the next push tries again. npm may have the
      # version by then, when only the last step failed
      - name: Check whether the version has a tag, and whether npm has it
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # next releases only a prerelease. A version without a prerelease part waits for main
          if [ "$GITHUB_REF_NAME" = next ] && [ "${VERSION#*-}" = "$VERSION" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$VERSION has no prerelease part: next does not release it, main does"
            exit 0
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "The tag v$VERSION exists: nothing to release"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$VERSION"
          fi

          if npm view "$NAME@$VERSION" version 2>/dev/null | grep -qxF "$VERSION"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to create the tag and the GitHub release
      id-token: write # for npm trusted publishing and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      # .nvmrc holds Node.js 24, whose npm 11 trusted publishing needs (11.5.1 or later)
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # Before anything else, so a version without a changelog entry is not released. The command
      # itself and not its script: the package manager prints a line of its own before a script
      - name: Release notes
        run: node_modules/.bin/chassis-tokens release-notes > "$RUNNER_TEMP/release-notes.md"

      - name: Lint source
        run: pnpm lint

      # Fails when the committed dist/ differs from a fresh build of source/
      - name: Verify dist/
        run: pnpm verify

      - name: Check Package.swift
        run: pnpm swift-package:check

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Checks the Gradle wrapper against Gradle's checksums. No cache: a release builds from
      # the published packages only
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # Before publishing, so a version whose Android libraries do not build is not published.
      # The Gradle project comes with @chassis-ui/tokens, and tokensRoot points it at dist/ here
      - name: Build the Android libraries
        run: |
          mkdir -p "$RUNNER_TEMP/aars"
          if [ -d dist/android ]; then
            ANDROID_PROJECT=node_modules/@chassis-ui/tokens/test/native/android
            sh "$ANDROID_PROJECT/gradlew" --project-dir "$ANDROID_PROJECT" :library:aars \
              -PtokensRoot="$PWD"
            cp "$ANDROID_PROJECT"/library/build/aars/*.aar "$RUNNER_TEMP/aars/"
          fi

      # Before publishing, so a version whose archives cannot be written is not published.
      # The package holds only the files of `files` in package.json
      - name: Write the archives
        run: pnpm archive

      # A version with a prerelease part, such as 0.2.0-next.0, goes to the dist-tag next
      - name: Publish to npm
        if: needs.detect.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac

          npm publish --provenance --access public --tag "$DIST_TAG"

      # Such a version is also marked as a prerelease and does not become the latest release
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          case "$VERSION" in
            *-*) FLAGS=(--prerelease --latest=false) ;;
            *) FLAGS=(--latest) ;;
          esac

          shopt -s nullglob
          gh release create "v$VERSION" \
            "$RUNNER_TEMP"/aars/*.aar \
            archives/*.zip \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${FLAGS[@]}"
